# Global variables are available to all shell scripts as operating system environment variables.
# These values are not specific to a development environment. If any of these differ by environment for your projec, move them into the vars-[environmtn].yaml files.
# See README.md for more information.

parameters:
- name: 'tpl_type'
  type: string
  default: ''

variables:
# Required
- name: REGION_NAME
  value: 'us-east-2'
  readonly: true
- name: AGENT_POOL
  value: "aws-cdk"

# Pin versions of tools.
# See README.md in cicd folder for version specification details of each tool.
# None of these values are required
- name: NODE_VERSION
  value: '20.11.0'
- name: CDK_VERSION
  value: '2.126.0'  
- name: PYTHON_VERSION
  value: ''

# Build PATH variables
# Update these to reflect the structure of your repository
- ${{ if eq(parameters.tpl_type, 'Build') }}:
  - name: LOCAL_PATH
    value: "$(Build.Repository.LocalPath)/"
  - name: INFRA_SCRIPTS_PATH
    value: '$(LOCAL_PATH)scripts/cicd/infra'
  - name: DOTNET_SCRIPTS_PATH
    value: '$(LOCAL_PATH)scripts/cicd/dotnet'
  - name: PUBLISH_PATH
    value: '$(LOCAL_PATH)dist'
  - name: BUILD_PATH
    value: '$(LOCAL_PATH)dist'
  - name: ARTIFACTSTAGING_PATH
    value: '$(Build.ArtifactStagingDirectory)'
  - name: TESTRESULT_PATH
    value: '$(Agent.TempDirectory)/$(Build.BuildId)'

# Deploy PATH and resource variables
# Update these to reflect the structure of your repository
- ${{ if eq(parameters.tpl_type, 'Deploy') }}:
  - name: RESOURCE_PIPELINE_NAME
    value: 'IntegrationPriorAuthCore'
  - name: ARTIFACT_NAME
    value: 'IntegrationPriorAuthCore' # artifact name from build pipeline

  - name: LOCAL_PATH
    value: '$(PIPELINE.WORKSPACE)/$(RESOURCE_PIPELINE_NAME)/$(ARTIFACT_NAME)/stage/'    
  - name: INFRA_SCRIPTS_PATH
    value: '$(LOCAL_PATH)scripts/cicd/infra'
  - name: DOTNET_SCRIPTS_PATH
    value: '$(LOCAL_PATH)scripts/cicd/dotnet'